[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "capsule"
version = "0.1.0"
description = "Cold-start clustering pipeline for personal multimodal assets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "XuRanHao" },
]
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.116,<1",
  "greenlet>=3.1,<4",
  "hdbscan>=0.8.40,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=3.0,<4",
  "numpy>=2.1,<3",
  "pillow>=11.0,<12",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymilvus>=2.5,<3",
  "python-multipart>=0.0.20,<1",
  "scenedetect>=0.7,<1",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
capsule = "capsule.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/capsule"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires locally running PostgreSQL/Milvus services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["capsule"]

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "hdbscan",
  "pymilvus",
  "sklearn.*",
]
ignore_missing_imports = true
